name: ASX check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Test ASX
        run: |
          python - <<'EOF'
          import json
          import requests

          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
               "Accept": "application/json, text/plain, */*", "Origin": "https://www.asx.com.au", "Referer": "https://www.asx.com.au/"}
          API = "https://asx.api.markitdigital.com/asx-research/1.0"
          results = {}

          print("1) Announcements for BHP")
          items = []
          try:
              r = requests.get(f"{API}/companies/bhp/announcements", headers=H, timeout=30)
              print("   status", r.status_code, r.headers.get("content-type"))
              data = r.json()
              items = (data.get("data") or {}).get("items") or []
              print("   items:", len(items))
              if items:
                  print("   fields:", sorted(items[0].keys()))
                  for it in items[:3]:
                      print("   -", it.get("date"), "|", it.get("headline"), "| price sensitive:", it.get("isPriceSensitive"))
              else:
                  print("   raw:", json.dumps(data)[:400])
              results["announcements"] = bool(items)
          except Exception as e:
              print("   FAILED:", type(e).__name__, str(e)[:200])
              results["announcements"] = False

          print("2) PDF download")
          try:
              key = next(it["documentKey"] for it in items if it.get("documentKey"))
              ok = False
              for url in (f"https://cdn-api.markitdigital.com/apiman-gateway/ASX/asx-research/1.0/file/{key}",
                          f"https://cdn-api.markitdigital.com/apiman-gateway/ASX/asx-research/1.0/file/{key}?access_token=83ff96335c2d45a094df02a206a39ff4"):
                  r = requests.get(url, headers=H, timeout=60)
                  pdf = r.content[:4] == b"%PDF"
                  print("   ", "with token" if "token" in url else "no token", "->", r.status_code, "PDF" if pdf else r.headers.get("content-type"))
                  ok = ok or pdf
              results["pdf"] = ok
          except Exception as e:
              print("   FAILED:", type(e).__name__, str(e)[:200])
              results["pdf"] = False

          print("3) Company list")
          found = False
          for url in (f"{API}/companies/directory?page=0&itemsPerPage=5&order=ascending&orderBy=companyName&includeFilterOptions=false&recentListingsOnly=false",
                      f"{API}/companies/directory/file?access_token=83ff96335c2d45a094df02a206a39ff4",
                      "https://www.asx.com.au/asx/research/ASXListedCompanies.csv"):
              try:
                  r = requests.get(url, headers=H, timeout=60)
                  print("   ", url.split("?")[0][-45:], "->", r.status_code, r.headers.get("content-type"), len(r.content), "bytes")
                  print("      start:", r.text[:160].replace("\n", " | "))
                  found = found or (r.status_code == 200 and len(r.content) > 500)
              except Exception as e:
                  print("   FAILED:", type(e).__name__, str(e)[:120])
          results["company_list"] = found

          print()
          print("RESULT:", "ALL PASSED" if all(results.values()) else "SOME FAILED", results)
          EOF
