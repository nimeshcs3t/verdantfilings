name: BSE check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Test BSE with homepage first
        run: |
          python - <<'EOF'
          import datetime as dt
          import requests

          s = requests.Session()
          s.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*", "Accept-Language": "en-IN,en;q=0.9",
              "Origin": "https://www.bseindia.com", "Referer": "https://www.bseindia.com/"})
          home = s.get("https://www.bseindia.com/", timeout=30)
          print("homepage:", home.status_code, "cookies:", list(s.cookies.keys()))
          end = dt.date.today(); start = end - dt.timedelta(days=4)
          r = s.get("https://api.bseindia.com/BseIndiaAPI/api/AnnSubCategoryGetData/w", timeout=30, params={
              "pageno": 1, "strCat": "-1", "subcategory": "-1", "strPrevDate": start.strftime("%Y%m%d"),
              "strToDate": end.strftime("%Y%m%d"), "strSearch": "P", "strscrip": "", "strType": "C"})
          print("announcements:", r.status_code, r.headers.get("content-type"))
          print("RESULT:", "PASSED" if r.status_code == 200 and "json" in (r.headers.get("content-type") or "") else "BLOCKED")
          EOF
