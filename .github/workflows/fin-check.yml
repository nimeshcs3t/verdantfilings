name: Financials check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Test financial data sources
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          python - <<'EOF'
          import datetime as dt, io, json, os, zipfile
          import requests

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"}
          J = lambda o, n=600: print("   ", json.dumps(o, ensure_ascii=False)[:n])

          print("=== TAIWAN: income statement and balance sheet ===")
          for name in ("t187ap06_L_ci", "t187ap07_L_ci"):
              r = requests.get(f"https://openapi.twse.com.tw/v1/opendata/{name}", headers=UA, timeout=60)
              print(f"[{name}] status {r.status_code}", end=" ")
              try:
                  d = r.json(); print("| rows:", len(d)); J(next((x for x in d if x.get("公司代號") == "2330"), d[0]), 900)
              except ValueError:
                  print("| not JSON:", r.text[:120])

          print("\n=== filings.xbrl.org (EU / UK annual reports) ===")
          g = requests.get("https://api.gleif.org/api/v1/lei-records", params={"filter[isin]": "FR0000121014"}, timeout=30).json()
          lvmh = g["data"][0]["id"] if g.get("data") else None
          print("    LVMH LEI from its ISIN:", lvmh)
          for label, lei in (("LVMH", lvmh), ("Shell", "21380068P1DRHMJ8KU70")):
              if not lei:
                  continue
              r = requests.get("https://filings.xbrl.org/api/filings", params={"filter[entity.identifier]": lei, "sort": "-period_end", "page[size]": 3},
                               headers={**UA, "Accept": "application/vnd.api+json"}, timeout=60)
              print(f"[{label}] status {r.status_code}", end=" ")
              items = r.json().get("data", []) if r.status_code == 200 else []
              print("| filings:", len(items))
              if items:
                  a = items[0].get("attributes", {})
                  print("    fields:", list(a)[:20])
                  print("    period_end:", a.get("period_end"), "| json_url:", a.get("json_url"))
                  if a.get("json_url"):
                      x = requests.get("https://filings.xbrl.org" + a["json_url"], headers=UA, timeout=120)
                      facts = (x.json().get("facts") or {}) if x.status_code == 200 else {}
                      print("    xBRL-JSON status", x.status_code, "| facts:", len(facts))
                      wanted = ("ifrs-full:Revenue", "ifrs-full:ProfitLoss", "ifrs-full:ProfitLossFromOperatingActivities")
                      for f in list(facts.values()):
                          dims = f.get("dimensions", {})
                          if dims.get("concept") in wanted and len(dims) <= 4:
                              print("    ", dims.get("concept"), dims.get("period"), dims.get("unit"), f.get("value"))

          print("\n=== JAPAN: EDINET financial data ===")
          key = os.environ.get("EDINET_API_KEY")
          if not key:
              print("    skipped: no EDINET_API_KEY secret")
          else:
              day = dt.date.today() - dt.timedelta(days=1)
              doc = None
              for _ in range(40):
                  r = requests.get("https://api.edinet-fsa.go.jp/api/v2/documents.json", params={"date": f"{day}", "type": 2, "Subscription-Key": key}, timeout=60)
                  doc = next((d for d in (r.json().get("results") or []) if d.get("docTypeCode") in ("120", "140") and d.get("secCode") and d.get("csvFlag") == "1"), None)
                  if doc:
                      break
                  day -= dt.timedelta(days=1)
              print("    sample:", doc and (doc["docID"], doc.get("filerName"), doc.get("docDescription")))
              if doc:
                  z = requests.get(f"https://api.edinet-fsa.go.jp/api/v2/documents/{doc['docID']}", params={"type": 5, "Subscription-Key": key}, timeout=120)
                  zf = zipfile.ZipFile(io.BytesIO(z.content))
                  name = next(n for n in zf.namelist() if n.endswith(".csv") and "jpcrp" in n)
                  text = zf.read(name).decode("utf-16", "ignore")
                  for line in text.splitlines():
                      if any(k in line for k in ("NetSales", "Revenue", "OperatingIncome", "ProfitLoss")):
                          print("   ", line[:200]); 
          EOF
