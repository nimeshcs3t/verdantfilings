name: Israel check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Report and company list fields
        run: |
          python - <<'EOF'
          import json
          import requests

          s = requests.Session()
          s.headers.update({"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
                            "Accept-Language": "en-US,en;q=0.9", "Referer": "https://maya.tase.co.il/",
                            "Origin": "https://maya.tase.co.il", "X-Maya-With": "allow"})

          print("=== Company reports, page 1 ===")
          r = s.get("https://mayaapi.tase.co.il/api/company/reports", params={"companyId": 604}, timeout=30)
          d = r.json()
          print("status", r.status_code, "| keys:", [k for k in d if k != "Reports"], "| TotalPages", d.get("TotalPages"),
                "| reports on this page:", len(d.get("Reports") or []))
          reps = d.get("Reports") or []
          if reps:
              print("report fields:", list(reps[0].keys()))
              for rep in reps[:3]:
                  print("sample:", json.dumps(rep, ensure_ascii=False)[:700])

          print("\n=== Company reports, page 2 ===")
          r2 = s.get("https://mayaapi.tase.co.il/api/company/reports", params={"companyId": 604, "page": 2}, timeout=30)
          reps2 = (r2.json().get("Reports") or []) if r2.status_code == 200 else []
          print("status", r2.status_code, "| reports:", len(reps2), "| same as page 1:",
                bool(reps and reps2 and json.dumps(reps2[0]) == json.dumps(reps[0])))

          print("\n=== Company list ===")
          r3 = s.get("https://api.tase.co.il/api/content/searchentities", params={"lang": 1},
                     headers={"Referer": "https://www.tase.co.il/"}, timeout=60)
          print("status", r3.status_code, "|", r3.headers.get("content-type"))
          try:
              items = r3.json()
              items = items if isinstance(items, list) else items.get("Items") or items
              print("entries:", len(items))
              if isinstance(items, list) and items:
                  print("fields:", list(items[0].keys()))
                  types = {}
                  for it in items:
                      types[it.get("Type")] = types.get(it.get("Type"), 0) + 1
                  print("count by Type:", types)
                  leumi = [it for it in items if "LEUMI" in json.dumps(it).upper()][:3]
                  for it in leumi:
                      print("leumi-like:", json.dumps(it, ensure_ascii=False)[:300])
          except ValueError:
              print("not JSON:", r3.text[:300])
          EOF
