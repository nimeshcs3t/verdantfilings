name: Israel check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Look inside MAYA company data
        run: |
          python - <<'EOF'
          import json
          import requests

          s = requests.Session()
          s.headers.update({"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
                            "Accept-Language": "en-US,en;q=0.9", "Referer": "https://maya.tase.co.il/",
                            "Origin": "https://maya.tase.co.il", "X-Maya-With": "allow"})
          API = "https://mayaapi.tase.co.il/api"

          r = s.get(f"{API}/company/alldetails", params={"companyId": 604}, timeout=30)
          print("alldetails status", r.status_code)
          data = r.json()

          def walk(obj, path="", depth=0):
              if depth > 3:
                  return
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      p = f"{path}.{k}" if path else k
                      if isinstance(v, list):
                          first = v[0] if v else None
                          keys = list(first.keys())[:14] if isinstance(first, dict) else type(first).__name__
                          print(f"LIST {p} ({len(v)} items) first item keys: {keys}")
                          if v and isinstance(first, dict) and any(x in p.lower() for x in ("report", "event", "message", "announce")):
                              print("   sample:", json.dumps(first, ensure_ascii=False)[:600])
                      elif isinstance(v, dict):
                          walk(v, p, depth + 1)
          walk(data)
          print("\ntop-level keys:", list(data)[:30] if isinstance(data, dict) else type(data).__name__)

          print("\n=== likely report addresses ===")
          for url, params in [
              (f"{API}/company/reports", {"companyId": 604}),
              (f"{API}/company/companyreports", {"companyId": 604}),
              (f"{API}/report/reports", {"companyId": 604}),
              (f"{API}/reports/company", {"companyId": 604}),
              (f"{API}/report/latest", {}),
              (f"{API}/report/breakingannouncement", {}),
          ]:
              try:
                  r = s.get(url, params=params, timeout=30)
                  print(r.status_code, url, "|", (r.headers.get("content-type") or "")[:30], "|", r.text[:160].replace("\n", " "))
              except Exception as e:
                  print("FAILED", url, type(e).__name__)
          EOF
