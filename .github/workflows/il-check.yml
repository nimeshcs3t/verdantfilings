name: Israel check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Test MAYA and MAGNA
        run: |
          python - <<'EOF'
          import datetime as dt, json, re
          import requests

          s = requests.Session()
          s.headers.update({"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36",
                            "Accept-Language": "en-US,en;q=0.9,he;q=0.8", "Referer": "https://maya.tase.co.il/",
                            "Origin": "https://maya.tase.co.il"})
          PROTECTION = ("incapsula", "imperva", "cf-chl", "cloudflare", "captcha", "akamai", "access denied",
                        "request unsuccessful", "_abck", "bm_sz", "datadome", "perimeterx")

          def show(label, method, url, **kw):
              print(f"\n=== {label} ===\n{method} {url}")
              try:
                  r = s.request(method, url, timeout=30, **kw)
              except Exception as e:
                  print("FAILED:", type(e).__name__, str(e)[:150]); return None
              body = r.text[:100000]
              cookies = ", ".join(c.name for c in s.cookies)
              hits = [p for p in PROTECTION if p in body.lower() or p in cookies.lower() or p in str(r.headers).lower()]
              print("status", r.status_code, "|", r.headers.get("content-type"), "| size", len(r.content),
                    "| server", r.headers.get("server"), "| cookies:", cookies or "none")
              print("bot protection signs:", hits or "none")
              text = " ".join(re.sub(r"<[^>]+>", " ", body).split())
              print("start:", text[:300])
              return r

          today = dt.date.today(); start = today - dt.timedelta(days=3)
          show("MAYA website", "GET", "https://maya.tase.co.il/")
          show("MAYA reports page", "GET", "https://maya.tase.co.il/reports/company")
          body = {"Page": 1, "GroupData": [], "DateFrom": f"{start}T00:00:00.000Z", "DateTo": f"{today}T23:59:59.000Z",
                  "IsBreakingAnnouncement": False, "IsForTaseMember": False, "Events": [], "Subjects": [], "QOpt": 1, "ViewPage": 2}
          r = show("MAYA reports data (guess 1)", "POST", "https://mayaapi.tase.co.il/api/report/filter", json=body,
                   headers={"X-Maya-With": "allow", "Content-Type": "application/json"})
          if r is not None and "json" in (r.headers.get("content-type") or ""):
              try:
                  data = r.json(); print("JSON keys:", list(data)[:10] if isinstance(data, dict) else type(data).__name__)
                  print("sample:", json.dumps(data, ensure_ascii=False)[:800])
              except ValueError:
                  pass
          show("MAYA company data (guess 2)", "GET", "https://mayaapi.tase.co.il/api/company/alldetails?companyId=604",
               headers={"X-Maya-With": "allow"})
          show("TASE market site", "GET", "https://market.tase.co.il/en/market_data/company/604/reports_maya")
          show("MAGNA (Securities Authority)", "GET", "https://www.magna.isa.gov.il/")
          EOF
