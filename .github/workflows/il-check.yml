name: Israel check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Find the company's own reports
        env:
          ENABLE_MAYA: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'EOF'
          import json
          from sources.il_maya import MayaWebSource, REPORTS

          src = MayaWebSource()

          def show(label, params, language):
              print(f"\n=== {label} ===")
              src._get(REPORTS, {"companyId": "2536"}, "https://maya.tase.co.il/")   # opens the session
              src._session.headers["Accept-Language"] = language
              try:
                  d = src._get(REPORTS, {"companyId": "2536", **params}, "https://maya.tase.co.il/")
              except Exception as e:
                  print("refused:", type(e).__name__, e); return False
              reps = d.get("Reports") or []
              print("ViewType:", d.get("ViewType"), "| TotalPages:", d.get("TotalPages"), "| reports:", len(reps))
              for r in reps[:10]:
                  print(" ", str(r.get("PubDate"))[:19], r.get("RptCode"), "|", (r.get("Subject") or "")[:70])
              return True

          ok = show("Hebrew view", {}, "he-IL,he;q=0.9")
          if ok:
              ok = show("Hebrew view, viewType 1", {"viewType": 1}, "he-IL,he;q=0.9")
          if ok:
              show("English view, viewType 1", {"viewType": 1}, "en-US,en;q=0.9")
          EOF
