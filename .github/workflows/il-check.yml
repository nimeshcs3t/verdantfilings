name: Israel check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Compare MAYA with what the app keeps
        env:
          ENABLE_MAYA: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'EOF'
          from datetime import timedelta
          from sources.il_maya import MayaWebSource, REPORTS
          from sources.base import Company

          src = MayaWebSource()
          print("=== What MAYA sends for SMSH (company 2536), page 1 ===")
          data = src._get(REPORTS, {"companyId": "2536"}, "https://maya.tase.co.il/")
          reps = data.get("Reports") or []
          print("TotalPages:", data.get("TotalPages"), "| reports on page:", len(reps),
                "| DateFrom:", data.get("DateFrom"), "| DateTo:", data.get("DateTo"))
          for r in reps[:30]:
              print(" ", str(r.get("PubDate"))[:19], r.get("RptCode"), "|", (r.get("Subject") or "")[:70])

          print("\n=== What the app keeps from that (last 180 days) ===")
          smsh = Company("IL", "SMSH", "2536", "", "SMSH")
          kept = src.list_filings(smsh, src.today() - timedelta(days=180), src.today())
          print("kept:", len(kept))
          for f in kept[:30]:
              print(" ", f.filed_date, f.uid, "|", (f.title_en or f.title_local)[:70])
          EOF
