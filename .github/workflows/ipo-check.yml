name: IPO check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Test IPO sources
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          python - <<'EOF'
          import datetime as dt, json, os, re
          import requests
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          SIGNS = ("incapsula", "imperva", "cf-chl", "cloudflare", "captcha", "access denied", "datadome", "perimeterx", "akamai")
          today = dt.date.today()

          def go(label, url, headers=None, **kw):
              h = {"User-Agent": UA, "Accept-Language": "en-US,en;q=0.9", **(headers or {})}
              try:
                  r = requests.get(url, headers=h, timeout=40, **kw)
              except Exception as e:
                  print(f"[{label}] FAILED {type(e).__name__}"); return None
              signs = [s for s in SIGNS if s in r.text[:50000].lower()]
              print(f"[{label}] status {r.status_code} | {(r.headers.get('content-type') or '')[:35]} | {len(r.content)} bytes | protection: {signs or 'none'}")
              return r

          def text(r, n=700):
              print("   ", " ".join(re.sub(r"<[^>]+>", " ", r.text).split())[:n])

          print("=== USA ===")
          r = go("Nasdaq IPO calendar", f"https://api.nasdaq.com/api/ipo/calendar?date={today:%Y-%m}",
                 {"Accept": "application/json", "Origin": "https://www.nasdaq.com", "Referer": "https://www.nasdaq.com/"})
          if r is not None and r.status_code == 200:
              d = (r.json().get("data") or {})
              for part in ("upcoming", "priced", "filed"):
                  block = d.get(part) or {}
                  rows = (block.get("upcomingTable") or block or {}).get("rows") if isinstance(block, dict) else None
                  print(f"    {part}: keys {list(block)[:5]} | rows {len(rows or [])}")
                  if rows:
                      print("   ", json.dumps(rows[0])[:400])
          r = go("SEC S-1/F-1 feed", "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=S-1&owner=include&count=10&output=atom",
                 {"User-Agent": f"VerdantFilings {os.environ.get('SEC_CONTACT_EMAIL', 'test@example.com')}"})
          if r is not None and r.status_code == 200:
              print("    entries:", r.text.count("<entry>"), "| first:", (re.search(r"<title>(.*?)</title>", r.text.split("<entry>")[1]) or [None, ""])[1] if "<entry>" in r.text else "")

          print("\n=== KOREA ===")
          key = os.environ.get("DART_API_KEY")
          if key:
              r = go("DART issue filings", "https://opendart.fss.or.kr/api/list.json", params={"crtfc_key": key, "pblntf_ty": "C",
                     "bgn_de": f"{today - dt.timedelta(days=30):%Y%m%d}", "end_de": f"{today:%Y%m%d}", "page_count": 100})
              if r is not None and r.status_code == 200:
                  items = r.json().get("list") or []
                  ipo = [i for i in items if "지분증권" in i.get("report_nm", "")]
                  print("    issue filings:", len(items), "| equity registration statements:", len(ipo))
                  for i in ipo[:3]:
                      print("   ", i.get("corp_name"), i.get("corp_cls"), i.get("report_nm"), i.get("rcept_dt"))
          r = go("KIND IPO schedule", "https://kind.krx.co.kr/listinvstg/pubofrschdl.do?method=searchPubofrScholMain")
          if r is not None and r.status_code == 200:
              text(r, 300)

          print("\n=== JAPAN ===")
          r = go("JPX new listings", "https://www.jpx.co.jp/english/listing/stocks/new/index.html")
          if r is not None and r.status_code == 200:
              rows = re.findall(r"<tr[^>]*>(.*?)</tr>", r.text, re.S)
              print("    table rows:", len(rows))
              for row in rows[1:4]:
                  print("   ", " ".join(re.sub(r"<[^>]+>", " | ", row).split())[:400])

          print("\n=== HONG KONG ===")
          r = go("HKEX new listings", "https://www2.hkexnews.hk/New-Listings/New-Listing-Information/Main-Board?sc_lang=en")
          if r is not None and r.status_code == 200:
              rows = re.findall(r"<tr[^>]*>(.*?)</tr>", r.text, re.S)
              print("    table rows:", len(rows))
              for row in rows[1:4]:
                  print("   ", " ".join(re.sub(r"<[^>]+>", " | ", row).split())[:400])

          print("\n=== AUSTRALIA ===")
          r = go("ASX upcoming floats", "https://www.asx.com.au/listings/upcoming-floats-and-listings")
          if r is not None and r.status_code == 200:
              print("    json links:", sorted(set(re.findall(r'https?://[^"\']+(?:upcoming|float)[^"\']*', r.text)))[:6])
              rows = re.findall(r"<tr[^>]*>(.*?)</tr>", r.text, re.S)
              print("    table rows:", len(rows))
              for row in rows[1:3]:
                  print("   ", " ".join(re.sub(r"<[^>]+>", " | ", row).split())[:300])
          EOF
