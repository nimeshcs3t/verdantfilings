name: Markets check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Details for new markets
        run: |
          python - <<'EOF'
          import datetime as dt, json, re
          import requests

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"}
          today = dt.date.today()
          day = today - dt.timedelta(days=1)
          while day.weekday() > 4:
              day -= dt.timedelta(days=1)
          J = lambda o, n=700: print("   ", json.dumps(o, ensure_ascii=False)[:n])

          print("=== JAPAN: one TDnet row ===")
          r = requests.get(f"https://www.release.tdnet.info/inbs/I_list_001_{day:%Y%m%d}.html", headers=UA, timeout=40)
          html = r.content.decode("utf-8", "ignore")
          rows = re.findall(r"<tr[^>]*>(.*?)</tr>", html, re.S)
          print("    rows:", len(rows), "| pager:", re.findall(r"I_list_\d{3}_\d{8}\.html", html)[:6])
          for row in rows[1:3]:
              print("   ", " ".join(row.split())[:700])

          print("\n=== FRANCE: one record ===")
          r = requests.get("https://www.info-financiere.gouv.fr/api/explore/v2.0/catalog/datasets/flux-amf-new-prod/records",
                           params={"limit": 1, "order_by": "uin_dat_amf desc"}, headers=UA, timeout=40)
          print("    status", r.status_code)
          d = r.json(); recs = d.get("records") or d.get("results") or []
          if recs:
              rec = recs[0].get("record", {}).get("fields") or recs[0]
              print("    fields:", list(rec)[:60]); J(rec, 1500)

          print("\n=== UK: Shell on the NSM ===")
          body = {"from": 0, "size": 3, "sort": "submitted_date", "sortorder": "desc",
                  "criteriaObj": {"criteria": [{"name": "company_lei", "value": ["", "21380068P1DRHMJ8KU70", "disclose_org", "related_org"]},
                                               {"name": "latest_flag", "value": "Y"}],
                                  "dateCriteria": [{"name": "publication_date", "value": {"from": None, "to": f"{today}T23:59:59Z"}},
                                                   {"name": "submitted_date", "value": {"from": None, "to": f"{today}T23:59:59Z"}}]}}
          r = requests.post("https://api.data.fca.org.uk/search?index=nsm-search", json=body, timeout=40,
                            headers={**UA, "Origin": "https://data.fca.org.uk", "Referer": "https://data.fca.org.uk/", "Accept": "application/json, text/plain, */*"})
          hits = (r.json().get("hits") or {}).get("hits") or []
          print("    status", r.status_code, "| hits:", len(hits))
          if hits:
              J(hits[0].get("_source"), 900)

          print("\n=== NORDICS: news filtered to one company ===")
          base = {"type": "json", "showAttachments": "true", "showCnsSpecific": "true", "showCompany": "true", "countResults": "false",
                  "freeText": "", "market": "", "cnscategory": "", "fromDate": "", "toDate": "", "globalGroup": "exchangeNotice",
                  "globalName": "NordicAllMarkets", "displayLanguage": "en", "language": "en", "timeZone": "CET",
                  "dateMask": "yyyy-MM-dd HH:mm:ss", "limit": 3, "start": 0, "dir": "DESC"}
          for label, extra in (("company=Novo Nordisk A/S", {"company": "Novo Nordisk A/S"}), ("freeText=Volvo", {"freeText": "Volvo", "company": ""})):
              r = requests.get("https://api.news.eu.nasdaq.com/news/query.action", params={**base, **extra}, timeout=40,
                               headers={**UA, "Origin": "https://www.nasdaq.com", "Referer": "https://www.nasdaq.com/"})
              items = ((r.json().get("results") or {}).get("item")) or []
              print(f"    [{label}] status {r.status_code} | items {len(items)} |", [(i.get("company"), i.get("headline", "")[:50]) for i in items])
          if items:
              print("    fields:", list(items[0].keys()))

          print("\n=== NORWAY: market-wide list and one message ===")
          h = {**UA, "Origin": "https://newsweb.oslobors.no", "Referer": "https://newsweb.oslobors.no/"}
          r = requests.get("https://api3.oslo.oslobors.no/v1/newsreader/list", params={"fromDate": f"{today - dt.timedelta(days=2)}", "toDate": f"{today}"}, headers=h, timeout=40)
          msgs = ((r.json().get("data") or {}).get("messages")) or []
          print("    market-wide status", r.status_code, "| messages:", len(msgs), "| issuers:", len({m.get("issuerSign") for m in msgs}))
          if msgs:
              r = requests.get("https://api3.oslo.oslobors.no/v1/newsreader/message", params={"messageId": msgs[0]["messageId"]}, headers=h, timeout=40)
              m = ((r.json().get("data") or {}).get("message")) or {}
              print("    message status", r.status_code, "| keys:", list(m)[:20], "| body:", " ".join(str(m.get("body", "")).split())[:200])

          print("\n=== TAIWAN: company list fields ===")
          r = requests.get("https://openapi.twse.com.tw/v1/opendata/t187ap03_L", headers=UA, timeout=60)
          rec = r.json()[0]
          print("    fields:", list(rec))
          print("    English name fields:", {k: v for k, v in rec.items() if "英文" in k})

          print("\n=== TICKER LOOKUP (for UK and Nordic companies) ===")
          r = requests.get("https://query1.finance.yahoo.com/v1/finance/search", params={"q": "Shell", "quotesCount": 5, "newsCount": 0}, headers=UA, timeout=30)
          print("    status", r.status_code)
          try:
              print("   ", [(q.get("symbol"), q.get("shortname"), q.get("exchange")) for q in r.json().get("quotes", [])])
          except ValueError:
              print("    not JSON:", r.text[:150])
          EOF
