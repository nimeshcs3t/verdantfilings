name: NewConnect check

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check translation
        run: |
          python - <<'EOF'
          from deep_translator import GoogleTranslator
          for src, text in [("pl", "Sporządzenie Aneksu nr 1 do Planu podziału"), ("ko", "자기주식취득결정"), ("auto", "Zwołanie Walnego Zgromadzenia")]:
              try:
                  print(src, "->", GoogleTranslator(source=src, target="en").translate(text))
              except Exception as e:
                  print(src, "FAILED:", type(e).__name__, str(e)[:200])
          EOF
