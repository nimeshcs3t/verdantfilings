name: Poll filings

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: poll-filings
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python worker.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          ENABLE_ASX: ${{ secrets.ENABLE_ASX }}
          ASX_ALERTS: ${{ secrets.ASX_ALERTS }}
          ENABLE_NEWCONNECT: ${{ secrets.ENABLE_NEWCONNECT }}
          ENABLE_MAYA: ${{ secrets.ENABLE_MAYA }}
          ENABLE_TDNET: ${{ secrets.ENABLE_TDNET }}
          ENABLE_HKEX: ${{ secrets.ENABLE_HKEX }}
          ENABLE_OSLO: ${{ secrets.ENABLE_OSLO }}
          ENABLE_TWSE: ${{ secrets.ENABLE_TWSE }}
          ENABLE_AMF: ${{ secrets.ENABLE_AMF }}
          ENABLE_UK_NSM: ${{ secrets.ENABLE_UK_NSM }}
          ENABLE_NORDIC: ${{ secrets.ENABLE_NORDIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TASE_API_KEY: ${{ secrets.TASE_API_KEY }}
          TASE_MAYA_PATH: ${{ secrets.TASE_MAYA_PATH }}
          TASE_DAILY_CALL_LIMIT: ${{ secrets.TASE_DAILY_CALL_LIMIT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
