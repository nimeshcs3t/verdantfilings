name: TASE probe

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m sources.il_tase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TASE_API_KEY: ${{ secrets.TASE_API_KEY }}
          TASE_MAYA_PATH: ${{ secrets.TASE_MAYA_PATH }}
          TASE_DAILY_CALL_LIMIT: "10"
