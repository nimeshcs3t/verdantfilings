[theme]
font = "sans serif"

[theme.light]
primaryColor = "#1E6A4E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6F5"
textColor = "#17212B"

[theme.dark]
primaryColor = "#62C59A"
backgroundColor = "#101615"
secondaryBackgroundColor = "#18201E"
textColor = "#E6ECE9"

[client]
toolbarMode = "viewer"
showSidebarNavigation = false

[server]
enableXsrfProtection = true
enableStaticServing = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false
