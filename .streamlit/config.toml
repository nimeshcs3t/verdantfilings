   [theme]
   font = "sans serif"

   [theme.light]
   primaryColor = "#1F6B4F"
   backgroundColor = "#FFFFFF"
   secondaryBackgroundColor = "#F2F5F3"
   textColor = "#1B2430"

   [theme.dark]
   primaryColor = "#5DBE93"
   backgroundColor = "#0F1413"
   secondaryBackgroundColor = "#1A211F"
   textColor = "#E4E9E6"

   [client]
   toolbarMode = "viewer"
   showSidebarNavigation = false

   [server]
   enableXsrfProtection = true
   fileWatcherType = "none"

   [browser]
   gatherUsageStats = false
